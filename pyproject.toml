[project]
name = "rag-support-system"
version = "0.1.0"
description = "RAGシステム PoC"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "llama-index-core==0.14.23",
    "llama-index-embeddings-huggingface==0.7.0",
    "torch==2.13.0",
    "llama-index-vector-stores-qdrant==0.10.2",
    # qdrant-client>=1.19.0はIDF_EMBEDDING_MODELSが削除されておりllama-index-vector-stores-qdrant 0.10.2のimportが壊れるため固定
    "qdrant-client==1.18.0",
    "FlagEmbedding==1.4.0",
    "llama-index-llms-ollama==0.10.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "streamlit==1.61.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "debugpy==1.8.21",
]

[tool.uv]
package = false

# PyTorchは実行環境に応じて自動で切り替わる（デプロイ時の手動差し替えは不要）。
#   linux/x86_64（AWS EC2のGPUインスタンス）          → CUDA版（cu126）
#   それ以外（MacのDevコンテナ＝linux/aarch64 など）  → CPU専用版
#
# CPU専用版は torch.cuda.is_available() が常にFalseを返すため、GPUがあっても使われない。
# CUDAが12.6なのは、EC2のDeep Learning Base AMIに同梱されるCUDAに合わせたため。
# また torch 2.13.0 のwheelは cu124 には配布されていない（cu124の最新は2.6.0）。
# 詳細は doc/デプロイ手順_AWS_EC2_GPU.md の4.3を参照。
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu",   marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
